name: Update gig radar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update.yml"
      - "src/**"
      - "tests/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - "data/genre-overrides.json"
      - "data/location-overrides.json"

permissions:
  contents: write

concurrency:
  group: gig-radar-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: python -m src.update --lastfm
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/capeet-gig-radar
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      - name: Commit generated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): update gig list [skip ci]"
            git push
          fi
