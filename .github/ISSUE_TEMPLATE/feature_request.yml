name: Feedback oder Idee
description: Schlage eine Verbesserung oder neue Funktion vor.
title: "[Idee] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Danke für dein Feedback zum Mosh Pit Crew Gig Radar.
  - type: textarea
    id: idea
    attributes:
      label: Deine Idee
      description: Was soll verbessert oder ergänzt werden?
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: Welches Problem löst das?
      description: Beschreibe kurz, wann und warum die Änderung hilfreich wäre.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Beispiel oder mögliche Umsetzung
      description: Optional kannst du Links, Skizzen oder konkrete Beispiele ergänzen.
